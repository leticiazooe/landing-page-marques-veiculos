name: Import Marques V3
on:
  push:
    paths:
      - .github/workflows/import-marques-v3.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import approved site package
        env:
          SOURCE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-a618-820e-aba8-fced7947799e/raw?se=2026-10-17T00%3A26%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=4581ce24-4aee-57a0-b2db-46e862849297&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-16T20%3A47%3A58Z&ske=2026-10-17T20%3A47%3A58Z&sks=b&skv=2026-02-06&sig=1Ut6JJuchpw53bXLXZHz5T%2Blsk0BC%2B4vcqHMNnR3GLY%3D'
        run: |
          set -euo pipefail
          mkdir -p /tmp/marques-transfer
          curl --fail --show-error --location --retry 3 "$SOURCE_URL" -o /tmp/marques-transfer/transport.tar.gz
          tar -xzf /tmp/marques-transfer/transport.tar.gz -C /tmp/marques-transfer
          test -f /tmp/marques-transfer/marques-site-v3.zip
          unzip -q /tmp/marques-transfer/marques-site-v3.zip -d /tmp/marques-transfer/unpacked
          test -f /tmp/marques-transfer/unpacked/marques-veiculos-react/package.json
          rsync -a --exclude='.git' --exclude='.github' /tmp/marques-transfer/unpacked/marques-veiculos-react/ ./
          test -f public/images/honda-civic.webp
          test -f public/images/volvo-xc60.webp
          test -f public/images/pluto.webp
          test -f src/components/VehicleDetails.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m 'feat: publicar catálogo V3 com Civic Volvo e Pluto'
            git push
          fi
