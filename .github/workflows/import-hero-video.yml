name: Importar video da hero
on:
  push:
    paths:
      - '.github/workflows/import-hero-video.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar video enviado
        run: |
          mkdir -p public/videos
          curl --fail --location --silent --show-error --retry 3 --max-time 120 "https://at.adobe.com/hujk01RKzCdhNguP" -o public/videos/marques-hero.mp4
          file public/videos/marques-hero.mp4
          test "$(stat -c%s public/videos/marques-hero.mp4)" -gt 1000000
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 public/videos/marques-hero.mp4 | grep -q h264
      - name: Adicionar video ao projeto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/marques-hero.mp4
          git diff --cached --quiet || (git commit -m "assets: adiciona video de fundo da hero" && git push)
