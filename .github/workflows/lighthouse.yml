name: Lighthouse - Auditoria de performance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lighthouse.yml'
      - 'src/components/Hero.tsx'
      - 'src/components/Header.tsx'
      - 'src/components/Footer.tsx'
      - 'src/components/Collection.tsx'
      - 'src/components/Visit.tsx'
      - 'src/index.css'
      - 'src/main.tsx'
      - 'vercel.json'
  schedule:
    - cron: '0 13 * * 1'
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Três amostras mobile (mediana evita conclusão por teste atípico)
        run: |
          for amostra in 1 2 3; do
            sucesso=0
            for tentativa in 1 2 3; do
              if npx --yes lighthouse@12 https://www.marquesveiculos.com.br/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance --quiet --output=json --output-path="./lighthouse-mobile-${amostra}.json"; then
                sucesso=1
                break
              fi
              echo "Mobile: Chrome falhou na amostra ${amostra}, tentativa ${tentativa}/3"
              sleep 4
            done
            if [ "$sucesso" != "1" ]; then exit 1; fi
          done
      - name: Auditoria desktop
        run: |
          for tentativa in 1 2 3; do
            if npx --yes lighthouse@12 https://www.marquesveiculos.com.br/ --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance --quiet --output=json --output-path=./lighthouse-desktop.json; then exit 0; fi
            echo "Desktop: falha temporária do Chrome, tentativa ${tentativa}/3"
            sleep 4
          done
          exit 1
      - name: Resumo e mediana de desempenho
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const mobile = [1, 2, 3].map(n => JSON.parse(readFileSync(`lighthouse-mobile-${n}.json`, 'utf8')));
          const desktop = JSON.parse(readFileSync('lighthouse-desktop.json', 'utf8'));
          const scores = mobile.map(d => Math.round(d.categories.performance.score * 100));
          const median = [...scores].sort((a,b) => a-b)[1];
          console.log('MOBILE | AMOSTRAS', scores.join(', '), '| MEDIANA', median, '| MÍNIMO', Math.min(...scores), '| MÁXIMO', Math.max(...scores));
          for (const [name, data] of [...mobile.map((d,i) => ['MOBILE-'+(i+1), d]), ['DESKTOP', desktop]]) {
            const a = data.audits;
            console.log(name, '| PERFORMANCE', Math.round(data.categories.performance.score * 100),
              '| LCP', a['largest-contentful-paint']?.displayValue,
              '| FCP', a['first-contentful-paint']?.displayValue,
              '| TBT', a['total-blocking-time']?.displayValue,
              '| CLS', a['cumulative-layout-shift']?.displayValue,
              '| CPU', a['bootup-time']?.displayValue);
          }
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: marques-lighthouse-results
          path: lighthouse-*.json
          retention-days: 7
